spring.application.name=NanoStock-Test

# Datasource SQLite Test
spring.datasource.url=jdbc:sqlite:file:nanostock_test?mode=memory&cache=shared
spring.datasource.driver-class-name=org.sqlite.JDBC

# Hibernate / JPA
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JTE
gg.jte.development-mode=true

# Desactivado por defecto en tests para aislar pruebas unitarias/integración
nanostock.demo.enabled=false
nanostock.demo.seed-on-startup=false
nanostock.demo.reset-interval-days=7
