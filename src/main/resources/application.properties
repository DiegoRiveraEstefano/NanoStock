spring.application.name=NanoStock

# Datasource SQLite
spring.datasource.url=jdbc:sqlite:nanostock.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# Hibernate / JPA
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JTE
gg.jte.development-mode=true

# Modo Demo de Portafolio (limpieza automática de datos nuevos cada 7 días)
nanostock.demo.enabled=true
nanostock.demo.reset-interval-days=7
nanostock.demo.seed-on-startup=true
nanostock.demo.demo-username=demo
nanostock.demo.demo-email=demo@nanostock.cl
nanostock.demo.demo-password=demo1234

spring.docker.compose.enabled=false
