[project]
name = "nanostock"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.14"
dependencies = [
  "pydantic[email-validator]==2.12.5",
  "pydantic-settings==2.1.0",
  "cachetools==6.2.4",
  "diskcache2==1.0.0",
  "click==8.3.1",
  "rich==14.2.0",
  "python-dotenv==1.2.1",
  "fastapi[standard]==0.128.3",
  "cryptography==46.0.3",
  "more-itertools==10.8.0",
  "passlib[bcrypt]==1.7.4",
  "python-multipart==0.0.22",
  "PyJWT==2.11.0",
  "structlog==25.5.0",
  "python-ulid[pydantic]==3.1.0",
  "sqlmodel==0.0.32",
  "aiocache==0.12.3",
  "async-lru==2.1.0",
  "aiojobs==1.4.0",
  "colorama==0.4.6"
]

[dependency-groups]
dev = [
  "ipdb==0.13.13",
  "mypy==1.19.1",
  "pyrefly>=0.48.1",
  "pre-commit==4.5.1",
  "ruff==0.14.14",
  "watchfiles==1.1.1",
  "werkzeug[watchdog]==3.1.5",
  "aiosqlite==0.22.1"
]

test = [
    "faker>=40.1.2",            # Generador de datos para tests
    "polyfactory>=3.2.0",       # Generador de datos para tests
    "hypothesis==6.150.2",      # Testing basado en propiedades
    "pytest>=9.0.2",            # Runner de tests
    "pytest-sugar==1.1.1",
    "coverage==7.13.1",
    "pytest-asyncio>=1.3.0",    # Soporte async para tests
    "pytest-cov>=7.0.0",        # Reporte de cobertura
    "testcontainers>=4.14.0",   # Bases de datos reales en Docker para tests
]

docs = [
  "sphinx==9.1.0",
  "sphinx-autobuild==2025.8.25",
]


# ==== pytest ====
[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--ds=config.settings.test --reuse-db --import-mode=importlib"
python_files = [
    "tests.py",
    "test_*.py",
]

# ==== Coverage ====
[tool.coverage.run]
include = ["src/**"]
omit = ["*/migrations/*", "*/tests/*"]
plugins = []

# ==== mypy ====
[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
plugins = []

[[tool.mypy.overrides]]
# Django migrations should not produce any errors:
module = "*.migrations.*"
ignore_errors = true

[tool.ruff]
# Exclude a variety of commonly ignored directories.
extend-exclude = [
    "*/migrations/*.py",
    "staticfiles/*",
]

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "C90",
    "I",
    "N",
    "UP",
    "YTT",
    # "ANN", # flake8-annotations: we should support this in the future but 100+ errors atm
    "ASYNC",
    "S",
    "BLE",
    "FBT",
    "B",
    "A",
    "COM",
    "C4",
    "DTZ",
    "T10",
    "DJ",
    "EM",
    "EXE",
    "FA",
    'ISC',
    "ICN",
    "G",
    'INP',
    'PIE',
    "T20",
    'PYI',
    'PT',
    "Q",
    "RSE",
    "RET",
    "SLF",
    "SLOT",
    "SIM",
    "TID",
    "TC",
    "INT",
    # "ARG", # Unused function argument
    "PTH",
    "ERA",
    "PD",
    "PGH",
    "PL",
    "TRY",
    "FLY",
    # "NPY",
    # "AIR",
    "PERF",
    # "FURB",
    # "LOG",
    "RUF",
]
ignore = [
    "S101", # Use of assert detected https://docs.astral.sh/ruff/rules/assert/
    "RUF012", # Mutable class attributes should be annotated with `typing.ClassVar`
    "SIM102", # sometimes it's better to nest
    # of types for comparison.
    # Deactivated because it can make the code slow:
    # https://github.com/astral-sh/ruff/issues/7871
]

[tool.ruff.lint.isort]
force-single-line = true
